<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUTORBIT — Generador de Miniatura 1920×1080</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800;1,900&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #090b10;
        color: #f1f1ed;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
      }
      .stage-wrap {
        position: relative;
        width: min(94vw, 1180px);
        aspect-ratio: 16 / 9;
        border: 2px solid #334155;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
        background: #05010f;
        overflow: hidden;
      }
      .stage-wrap canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .controls {
        width: min(94vw, 1180px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #11141d;
        border: 2px solid #262c3f;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 12px;
      }
      .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .controls-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #cbd5e1;
      }
      input[type='text'] {
        background: #090b10;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        width: 150px;
      }
      input[type='range'] {
        width: 92px;
        accent-color: #22d3ee;
      }
      button {
        cursor: pointer;
        border: 2px solid #0b0d12;
        font-weight: 800;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
      }
      .btn-primary {
        background: #22d3ee;
        color: #0b0d12;
        box-shadow: 3px 3px 0 #e11d48;
      }
      .btn-secondary {
        background: #1e293b;
        color: #f8fafc;
        border-color: #475569;
      }
      .hint {
        color: #64748b;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="stage-wrap">
      <canvas id="gl-canvas" width="1920" height="1080"></canvas>
      <canvas id="ui-canvas" width="1920" height="1080"></canvas>
    </div>

    <div class="controls">
      <div class="controls-row">
        <div class="controls-group">
          <label title="Usa | para dividir colores como en el logo (ej. OUT|ORBIT). Déjalo vacío para ocultar.">
            Logo:
            <input id="inp-logo" type="text" value="OUT|ORBIT" style="width: 115px" />
          </label>
          <label>
            Tag superior:
            <input id="inp-tag" type="text" value="ZERO-G ROGUELIKE" style="width: 145px" />
          </label>
          <label>
            Subtítulo:
            <input id="inp-sub" type="text" value="Gameplay showcase v1.0.0" style="width: 195px" />
          </label>
          <label>
            Texto extra:
            <input id="inp-ver" type="text" value="" placeholder="(opcional)" style="width: 110px" />
          </label>
        </div>
        <button id="btn-download" class="btn-primary" type="button">
          Descargar PNG (1920×1080)
        </button>
      </div>

      <div class="controls-row">
        <div class="controls-group">
          <label>
            Ángulo texto (°):
            <input id="inp-text-angle" type="range" min="-90" max="15" step="1" value="-75" />
          </label>
          <label>
            Tamaño texto:
            <input id="inp-text-scale" type="range" min="0.7" max="1.45" step="0.05" value="1.0" />
          </label>
          <label>
            Rotar Nyx:
            <input id="inp-rot" type="range" min="-3.14" max="3.14" step="0.02" value="-0.34" />
          </label>
          <label>
            Inclinación Nyx:
            <input id="inp-tilt" type="range" min="-0.6" max="0.6" step="0.02" value="-0.10" />
          </label>
          <label>
            Zoom Nyx:
            <input id="inp-zoom" type="range" min="3.0" max="6.8" step="0.05" value="4.65" />
          </label>
          <button id="btn-pause" class="btn-secondary" type="button">Reanudar giro</button>
        </div>
        <span class="hint">Borra cualquier campo de texto para ocultarlo (sin textos forzados).</span>
      </div>
    </div>

    <script type="module" src="/miniatura/main.ts"></script>
  </body>
</html>
