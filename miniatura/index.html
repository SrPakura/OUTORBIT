<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUTORBIT — Generador de Miniatura 1920×1080</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #090b10;
        color: #f1f1ed;
        font-family: 'Barlow Condensed', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 20px;
      }
      .stage-wrap {
        position: relative;
        width: min(92vw, 1200px);
        aspect-ratio: 16 / 9;
        border: 3px solid #22d3ee;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
        background: #05010f;
        overflow: hidden;
      }
      .stage-wrap canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .controls {
        width: min(92vw, 1200px);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        background: #11141d;
        border: 2px solid #262c3f;
        padding: 12px 16px;
        border-radius: 10px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      .controls-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #cbd5e1;
      }
      input[type='text'] {
        background: #090b10;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        width: 155px;
      }
      input[type='range'] {
        width: 100px;
        accent-color: #22d3ee;
      }
      button {
        cursor: pointer;
        border: 2px solid #0b0d12;
        font-weight: 800;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
      }
      .btn-primary {
        background: #22d3ee;
        color: #0b0d12;
        box-shadow: 3px 3px 0 #e11d48;
      }
      .btn-secondary {
        background: #1e293b;
        color: #f8fafc;
        border-color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="stage-wrap">
      <canvas id="gl-canvas" width="1920" height="1080"></canvas>
      <canvas id="ui-canvas" width="1920" height="1080"></canvas>
    </div>

    <div class="controls">
      <div class="controls-group">
        <label>
          Subtítulo:
          <input id="inp-sub" type="text" value="GAMEPLAY SHOWCASE" />
        </label>
        <label>
          Versión:
          <input id="inp-ver" type="text" value="v1.0.0" style="width: 90px" />
        </label>
        <label>
          Rotar Nyx:
          <input id="inp-rot" type="range" min="-3.14" max="3.14" step="0.02" value="-0.35" />
        </label>
        <label>
          Inclinación:
          <input id="inp-tilt" type="range" min="-0.6" max="0.6" step="0.02" value="-0.14" />
        </label>
        <label>
          Zoom Nyx:
          <input id="inp-zoom" type="range" min="2.5" max="4.8" step="0.05" value="3.35" />
        </label>
        <button id="btn-pause" class="btn-secondary" type="button">Pausar giro</button>
      </div>

      <button id="btn-download" class="btn-primary" type="button">
        Descargar PNG (1920×1080)
      </button>
    </div>

    <script type="module" src="/miniatura/main.ts"></script>
  </body>
</html>
